<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08643f"><link rel="manifest" href="manifest.json"><title>PickleMate Social</title><style>
:root{--g:#08643f;--g2:#0d8b54;--mint:#e4f3eb;--ink:#18211c;--muted:#68716c;--line:#e8ece9;--bg:#f5f6f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1050px;margin:auto;padding-bottom:85px}.top{display:flex;justify-content:space-between;align-items:center;padding:20px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand em{color:var(--g2);font-family:Georgia,serif;font-weight:500}.content{padding:0 18px}.hero{background:linear-gradient(125deg,#064b32,#0a7a49);color:white;border-radius:24px;padding:24px;min-height:190px}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}.hero h1{font-size:clamp(30px,5vw,42px);line-height:1.02;margin:12px 0 8px;letter-spacing:-1.5px}.hero p{font-size:14px;color:#e0f2e8;max-width:450px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--g);color:white}.hero .primary{background:white;color:var(--g)}.light{background:var(--mint);color:var(--g)}.outline{background:white;border:1px solid var(--line)}.section{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px;gap:8px}.section h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:12px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{background:white;border:1px solid var(--line);border-radius:18px;padding:13px 5px}.qicon{width:40px;height:40px;border-radius:13px;background:var(--mint);display:grid;place-items:center;margin:auto auto 7px;font-size:21px}.quick strong{display:block;font-size:12px}.quick small{font-size:10px;color:var(--muted)}.list{display:grid;gap:11px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:13px;display:grid;grid-template-columns:55px 1fr auto;gap:11px;align-items:center}.date{background:#f0f4f0;border-radius:13px;text-align:center;padding:8px 2px}.date b{display:block;font-size:22px}.date span{display:block;text-transform:uppercase;font-size:10px;color:var(--muted);font-weight:800}.title{font-size:14px;font-weight:800;margin-bottom:4px}.meta{font-size:11px;color:var(--muted);line-height:1.6}.pill{display:inline-block;background:var(--mint);color:var(--g);padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;margin-top:5px}.result{border-radius:11px;padding:8px;min-width:65px;text-align:center;background:#edf8e7;color:#245c23;font-size:10px;font-weight:750}.result b{display:block;font-size:14px}.loss{background:#fff0ee;color:#b83a39}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:13px 10px}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:5px;background:#e9eeea;padding:5px;border-radius:13px;margin:15px 0}.tabs button{flex:1;border:0;border-radius:9px;padding:10px 4px;background:transparent;font-weight:750;color:var(--muted);font-size:12px}.tabs .active{background:var(--g);color:white}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.ball{height:40px;width:40px;border-radius:50%;display:grid;place-items:center;background:var(--mint)}.panel,.profile{background:white;border:1px solid var(--line);border-radius:20px;padding:16px}.profile{text-align:center;padding:24px}.avatar{margin:auto auto 9px;background:var(--mint);color:var(--g);border-radius:50%;width:70px;height:70px;display:grid;place-items:center;font-size:28px;font-weight:800}.profile h2{margin:0 0 4px}.venuegrid,.playergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.venue,.player{background:white;border:1px solid var(--line);border-radius:17px;padding:14px}.art{height:75px;border-radius:12px;background:linear-gradient(135deg,#c8e5d5,#edf4dc);display:grid;place-items:center;font-size:30px;margin-bottom:10px}.venue h3,.player h3{font-size:14px;margin:0 0 4px}.search{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);margin:8px 0 12px}.form{display:grid;gap:11px}.form label{display:grid;gap:5px;font-size:12px;font-weight:750}.form input,.form select{width:100%;padding:12px;border:1px solid #dfe5e0;border-radius:11px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(650px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#7c857f;border-radius:12px;padding:6px 2px;font-size:10px;font-weight:750}.nav span{display:block;font-size:20px}.nav .active{background:var(--mint);color:var(--g)}.empty{background:white;border:1px dashed #d4ddd6;border-radius:16px;text-align:center;padding:24px;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#10201888;align-items:flex-end;justify-content:center;padding:12px;z-index:9}.modal{background:white;border-radius:22px;padding:20px;width:min(580px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.toast{display:none;position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#17231c;color:white;padding:12px 16px;border-radius:12px;font-size:12px;z-index:11}
@media(min-width:760px){.content{padding:0 28px}.homegrid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.venuegrid,.playergrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:420px){.content{padding:0 12px}.top{padding:17px 14px}.brand{font-size:22px}.quick{gap:6px}.quick button{padding:10px 3px}.quick strong{font-size:10px}.card{grid-template-columns:48px 1fr auto;gap:7px;padding:10px}.title{font-size:12px}.meta{font-size:10px}.stats{gap:6px}.stat{padding:10px 7px}.stat b{font-size:20px}.venuegrid,.playergrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand">PickleMate <em>Social</em></div><button class="btn outline" onclick="go('Profile')">🙂</button></header><main class="content" id="view"></main></div><nav class="bottom"><div class="nav" id="nav"></div></nav><div id="toast" class="toast"></div><div class="modalbg" id="mb" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const seed=[{id:'1',title:'Sunday Social Game',date:'2026-10-25',time:'4:00 PM – 6:00 PM',venue:'DUPR Pickleball Hub',city:'Kuala Lumpur',level:'Mixed Level',status:'Past',score:'11–8',result:'Won',players:['Sarah','Ken','Wei','Jane']},{id:'2',title:'Midweek Ladder',date:'2026-10-21',time:'7:00 PM – 9:00 PM',venue:'Pickle First Club',city:'Petaling Jaya',level:'Intermediate',status:'Past',score:'9–11',result:'Lost',players:['Ali','Mei','Jason','Li Na']},{id:'3',title:'Morning Dink',date:'2026-10-17',time:'9:00 AM – 11:00 AM',venue:'The Playground KL',city:'Kuala Lumpur',level:'Beginner Friendly',status:'Past',score:'11–6',result:'Won',players:['Celine','Bryan','TC','Nicole']},{id:'4',title:'Evening Mix Game',date:'2026-11-05',time:'6:00 PM – 8:00 PM',venue:'Pickle First Club',city:'Petaling Jaya',level:'Open Play',status:'Upcoming',score:'',result:'',players:['Sarah','Ken','Mei']},{id:'5',title:'Beginner Friendly Dink & Play',date:'2026-11-08',time:'10:00 AM – 12:00 PM',venue:'The Playground KL',city:'Kuala Lumpur',level:'Beginner Friendly',status:'Upcoming',score:'',result:'',players:['Ali','Wei','Jane']}];
let games=JSON.parse(localStorage.getItem('pm_games')||'null')||seed, players=JSON.parse(localStorage.getItem('pm_players')||'null')||[{name:'Sarah',level:'Intermediate',city:'Kuala Lumpur'},{name:'Ken',level:'Beginner',city:'Petaling Jaya'},{name:'Mei',level:'Advanced beginner',city:'Kuala Lumpur'},{name:'Jason',level:'Intermediate',city:'Shah Alam'}],venues=JSON.parse(localStorage.getItem('pm_venues')||'null')||[{name:'Pickle First Club',city:'Petaling Jaya',courts:8,indoor:true},{name:'DUPR Pickleball Hub',city:'Kuala Lumpur',courts:6,indoor:true},{name:'The Playground KL',city:'Kuala Lumpur',courts:4,indoor:false}],name=localStorage.getItem('pm_name')||'Dinnie',page='Home',htab='Past Games';
const navs=[['Home','⌂'],['Games','▣'],['History','◷'],['Community','♧'],['Profile','♙']];const $=s=>document.querySelector(s);
function save(){localStorage.setItem('pm_games',JSON.stringify(games));localStorage.setItem('pm_players',JSON.stringify(players));localStorage.setItem('pm_venues',JSON.stringify(venues));localStorage.setItem('pm_name',name)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pretty(d){return d?new Date(d+'T12:00:00').toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'Date TBC'}
function tile(d){let x=d?new Date(d+'T12:00:00'):new Date();return `<div class="date"><span>${d?x.toLocaleDateString('en-MY',{weekday:'short'}):'TBC'}</span><b>${d?x.getDate():'—'}</b><span>${d?x.toLocaleDateString('en-MY',{month:'short'}):'Date'}</span></div>`}
function past(){return games.filter(g=>g.status==='Past').sort((a,b)=>b.date.localeCompare(a.date))}function up(){return games.filter(g=>g.status==='Upcoming').sort((a,b)=>a.date.localeCompare(b.date))}function stats(){let p=past(),w=p.filter(g=>g.result==='Won').length;return [p.length,w,p.length-w,p.length?Math.round(w/p.length*100):0]}
function game(g){return `<article class="card">${tile(g.date)}<div><div class="title">${esc(g.title)}</div><div class="meta">📍 ${esc(g.venue)} · ${esc(g.city||'')}<br>◷ ${esc(g.time||'Time TBC')}</div><span class="pill">${esc(g.level||'Social game')}</span></div><div>${g.status==='Upcoming'?`<button class="btn primary" onclick="join('${g.id}')">Join</button>`:`<div class="result ${g.result==='Lost'?'loss':''}">${esc(g.result||'Played')}<b>${esc(g.score||'—')}</b></div><button class="btn light" style="margin-top:5px;padding:6px;font-size:10px" onclick="score('${g.id}')">Edit score</button>`}</div></article>`}
function hist(g){return `<div class="row"><div class="ball">${g.result==='Won'?'🏆':'🎾'}</div><div><div class="title">${esc(g.title)}</div><div class="meta">${pretty(g.date)}<br>📍 ${esc(g.venue)} · ${esc(g.city||'')}<br>◷ ${esc(g.time||'Time TBC')}</div><div class="muted">Players: ${esc((g.players||[]).join(', ')||'Not recorded')}</div></div><div class="result ${g.result==='Lost'?'loss':''}">${esc(g.result||'Played')}<b>${esc(g.score||'—')}</b></div></div>`}
function statcards(){let s=stats();return `<div class="stats">${[[''+s[0],'Games played'],[''+s[1],'Wins'],[''+s[2],'Losses'],[s[3]+'%','Win rate']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`}
function nav(){ $('#nav').innerHTML=navs.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}
function go(p){page=p;render()}
function home(){return `<div class="homegrid"><div><section class="hero"><div class="eyebrow">Your pickleball community</div><h1>Good people.<br>Great games.</h1><p>Find your next game, meet your people, and keep every score in one place.</p><button class="btn primary" onclick="go('Games')">Find a game ↗</button> <button class="btn light" onclick="create()">＋ Host a game</button></section><div class="section"><h2>Quick access</h2></div><div class="quick">${[['▣','Find a game','Join a session',"go('Games')"],['＋','Create game','Host a session','create()'],['♧','Players','Find partners',"go('Community')"],['⌖','Venues','Explore courts',"go('Venues')"]].map(x=>`<button onclick="${x[3]}"><div class="qicon">${x[0]}</div><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div></div><div><div class="section"><h2>Upcoming games</h2><button class="btn light" onclick="go('Games')">See all →</button></div><div class="list">${up().slice(0,2).map(game).join('')||'<div class="empty">No upcoming games yet.</div>'}</div><div class="section"><h2>Your stats</h2><button class="btn light" onclick="go('History')">History →</button></div>${statcards()}</div></div>`}
function gamesPage(){return `<div class="section"><div><h2>Find your next game</h2><div class="muted">Open play, friendly matches and more</div></div><button class="btn primary" onclick="create()">＋ Create</button></div><input class="search" id="gs" placeholder="Search game, venue or city…" oninput="filterGames()"><div class="list" id="gres">${up().map(game).join('')||'<div class="empty">Be the first to host a game.</div>'}</div>`}
function filterGames(){let q=$('#gs').value.toLowerCase();$('#gres').innerHTML=up().filter(g=>(g.title+' '+g.venue+' '+g.city+' '+g.level).toLowerCase().includes(q)).map(game).join('')||'<div class="empty">No matching games.</div>'}
function historyPage(){let s=stats(),a=htab==='Upcoming'?up():past();return `<div class="section"><div><h2>My games</h2><div class="muted">Your personal match record</div></div><button class="btn outline" onclick="exportCSV()">⇩ Export</button></div><div class="tabs">${['Upcoming','Past Games','Stats'].map(t=>`<button class="${htab===t?'active':''}" onclick="htab='${t}';render()">${t}</button>`).join('')}</div>${htab==='Stats'?`${statcards()}<div class="panel" style="margin-top:12px"><h3>Recent results</h3>${past().map(hist).join('')||'<div class="empty">No scores recorded.</div>'}</div>`:htab==='Upcoming'?`<div class="list">${a.map(game).join('')||'<div class="empty">No upcoming games.</div>'}</div>`:`<div class="panel">${a.map(hist).join('')||'<div class="empty">No past games yet.</div>'}</div>`}<p class="muted">History shows game date, venue, time, score, result and players.</p>`}
function profile(){let s=stats();return `<div class="profile"><div class="avatar">${esc(name.slice(0,1).toUpperCase())}</div><h2>${esc(name)}</h2><p class="muted">Here for good games and great people 🟢</p><button class="btn light" onclick="editName()">✎ Edit profile</button><div style="margin-top:18px">${statcards()}</div></div><div class="section"><h2>Recent games</h2><button class="btn light" onclick="go('History')">See all →</button></div><div class="panel">${past().slice(0,3).map(hist).join('')||'<div class="empty">Your played games will appear here.</div>'}</div><div class="section"><h2>Favourite venues</h2><button class="btn light" onclick="go('Venues')">See all →</button></div><div class="venuegrid">${venues.slice(0,2).map(venueCard).join('')}</div>`}
function venueCard(v){return `<div class="venue"><div class="art">🎾</div><h3>${esc(v.name)}</h3><p class="muted">${esc(v.city)}<br>${v.courts} courts · ${v.indoor?'Indoor':'Outdoor'}</p><button class="btn light" onclick="venueGames('${esc(v.name)}')">View games</button></div>`}
function venuesPage(){return `<div class="section"><div><h2>Venues</h2><div class="muted">Find your next court</div></div><button class="btn primary" onclick="addVenue()">＋ Add venue</button></div><div class="venuegrid">${venues.map(venueCard).join('')}</div>`}
function venueGames(v){go('Games');setTimeout(()=>{if($('#gs')){$('#gs').value=v;filterGames()}},10)}
function community(){return `<div class="section"><div><h2>Community</h2><div class="muted">Meet players and find partners</div></div><button class="btn primary" onclick="addPlayer()">＋ Add player</button></div><input class="search" id="ps" placeholder="Search players by name or level…" oninput="filterPlayers()"><div class="playergrid" id="pres">${playerCards(players)}</div><div class="panel" style="margin-top:12px"><h3>Community board</h3><p class="muted">Share an invite with your pickleball group.</p><button class="btn light" onclick="share()">↗ Share invite</button></div>`}
function playerCards(a){return a.map(p=>`<div class="player"><div class="avatar" style="width:45px;height:45px;font-size:18px;margin:0 0 10px">${esc(p.name.slice(0,1).toUpperCase())}</div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.level)}<br>📍 ${esc(p.city||'Location not set')}</p></div>`).join('')||'<div class="empty">No players found.</div>'}
function filterPlayers(){let q=$('#ps').value.toLowerCase();$('#pres').innerHTML=playerCards(players.filter(p=>(p.name+' '+p.level+' '+p.city).toLowerCase().includes(q)))}
function render(){nav();$('#view').innerHTML=page==='Home'?home():page==='Games'?gamesPage():page==='History'?historyPage():page==='Profile'?profile():page==='Community'?community():venuesPage()}
function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function openModal(s){$('#modal').innerHTML=s;$('#mb').style.display='flex'}function closeModal(){$('#mb').style.display='none'}
function create(){openModal(`<div class="modalhead"><h2>Host a game</h2><button class="btn outline" onclick="closeModal()">✕</button></div><form class="form" onsubmit="makeGame(event)"><label>Game title<input name="title" required placeholder="Evening Mix Game"></label><label>Date<input name="date" type="date" required min="${new Date().toISOString().slice(0,10)}"></label><label>Time<input name="time" required placeholder="6:00 PM – 8:00 PM"></label><label>Venue<input name="venue" list="vlist" required placeholder="Pickle First Club"><datalist id="vlist">${venues.map(v=>`<option value="${esc(v.name)}">`).join('')}</datalist></label><label>City<input name="city" placeholder="Kuala Lumpur"></label><label>Skill level<select name="level"><option>Open Play</option><option>Beginner Friendly</option><option>Mixed Level</option><option>Intermediate</option><option>Advanced</option></select></label><label>Format<select name="format"><option>Mix Doubles</option><option>Rotating Partners</option><option>Friendly Games</option><option>Ladder</option></select></label><button class="btn primary">Create game</button></form>`)}
function makeGame(e){e.preventDefault();let f=new FormData(e.target);games.push({id:String(Date.now()),title:f.get('title'),date:f.get('date'),time:f.get('time'),venue:f.get('venue'),city:f.get('city'),level:f.get('level'),format:f.get('format'),status:'Upcoming',score:'',result:'',players:[]});save();closeModal();go('Games');toast('Game created on this device.')}
function join(id){let g=games.find(x=>x.id===id);if(!g.players.includes(name))g.players.push(name);save();render();toast('Joined on this device.')}
function score(id){let g=games.find(x=>x.id===id);openModal(`<div class="modalhead"><h2>Record score</h2><button class="btn outline" onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveScore(event,'${id}')"><label>Result<select name="result"><option>Won</option><option>Lost</option></select></label><label>Score<input name="score" required placeholder="11–8" value="${esc(g.score)}"></label><button class="btn primary">Save score</button></form>`)}
function saveScore(e,id){e.preventDefault();let g=games.find(x=>x.id===id),f=new FormData(e.target);g.result=f.get('result');g.score=f.get('score');g.status='Past';save();closeModal();render();toast('Score saved to match history.')}
function editName(){openModal(`<div class="modalhead"><h2>Edit profile</h2><button class="btn outline" onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveName(event)"><label>Display name<input name="name" value="${esc(name)}" required></label><button class="btn primary">Save profile</button></form>`)}
function saveName(e){e.preventDefault();name=new FormData(e.target).get('name').trim();save();closeModal();render();toast('Profile updated.')}
function addPlayer(){openModal(`<div class="modalhead"><h2>Add player</h2><button class="btn outline" onclick="closeModal()">✕</button></div><form class="form" onsubmit="savePlayer(event)"><label>Name<input name="name" required></label><label>Skill level<select name="level"><option>Beginner</option><option>Advanced beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>City<input name="city"></label><button class="btn primary">Add player</button></form>`)}
function savePlayer(e){e.preventDefault();let f=new FormData(e.target);players.push({name:f.get('name'),level:f.get('level'),city:f.get('city')});save();closeModal();render();toast('Player added.')}
function addVenue(){openModal(`<div class="modalhead"><h2>Add venue</h2><button class="btn outline" onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveVenue(event)"><label>Venue name<input name="name" required></label><label>City<input name="city" required></label><label>Number of courts<input name="courts" type="number" min="1" value="2" required></label><label>Type<select name="type"><option value="indoor">Indoor</option><option value="outdoor">Outdoor</option></select></label><button class="btn primary">Save venue</button></form>`)}
function saveVenue(e){e.preventDefault();let f=new FormData(e.target);venues.push({name:f.get('name'),city:f.get('city'),courts:+f.get('courts'),indoor:f.get('type')==='indoor'});save();closeModal();render();toast('Venue added.')}
function exportCSV(){let rows=[['Game','Date','Time','Venue','City','Result','Score','Players'],...past().map(g=>[g.title,g.date,g.time,g.venue,g.city,g.result,g.score,(g.players||[]).join('; ')])];let csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='PickleMate-Match-History.csv';a.click();URL.revokeObjectURL(a.href);toast('Match history exported.')}
function share(){let msg='Join our PickleMate Social group and let’s play pickleball!';if(navigator.share)navigator.share({title:'PickleMate Social',text:msg}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>toast('Invite copied.')).catch(()=>toast(msg));else toast(msg)}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
